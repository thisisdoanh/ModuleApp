name: dev_dependency
description: "Shared code generation tools - all generators for the monorepo (each package adds build_runner directly)"
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.11.0"

dependencies:
  flutter:
    sdk: flutter

  # Code generation
  build_runner: ^2.12.2
  freezed: ^3.2.5
  injectable_generator: ^2.12.1
  json_serializable: ^6.9.5
  flutter_gen_runner: ^5.13.0+1
  hive_ce_generator: ^1.11.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
